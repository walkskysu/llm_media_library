[package]
name = "llm-media-library"
version = "0.1.5"
description = "Bookmark YouTube videos and auto-generate structured transcripts with Gemini"
authors = ["walksky"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "llm_media_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ureq = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
