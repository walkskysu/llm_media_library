name: Release

# Draft + manual publish:
# Push a tag like `v0.2.0` (after bumping the version with
# `npm run version:set -- 0.2.0`) to build the Windows installers and
# create a *draft* GitHub Release with the installers attached. The workflow
# never publishes: a maintainer reviews the draft (notes, assets) and clicks
# "Publish release" on GitHub. Until then the release is invisible to users
# and to the in-app update check.
# If a release for the tag already exists (draft or published, e.g. created
# by hand), the installers are uploaded to it and its draft/published state
# is left unchanged. Run manually (workflow_dispatch) with an existing tag to
# (re)attach the installers to that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify version & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match the app version
        run: node scripts/version.mjs check "$TAG"
      - run: npm run typecheck
      - run: npm test

  build-windows:
    name: Build Windows installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Rust tests
        run: npm run test:rust
      - name: Build NSIS + MSI installers
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  release:
    name: Create draft GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist-release
      - name: Collect files and checksums
        run: |
          mkdir -p upload
          find dist-release -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} upload/ \;
          cd upload
          sha256sum * > SHA256SUMS.txt
          ls -l
      - name: Create draft release or update existing one
        run: |
          VERSION="${TAG#v}"
          # Find any release for this tag, including drafts (which
          # `gh release view <tag>` cannot reliably see). Prefer a published
          # one; otherwise reuse an existing draft.
          find_release() {
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | \"\\(.draft) \\(.id)\"" \
              | sort | head -n1 | cut -d' ' -f2
          }
          id=$(find_release)
          if [[ -z "$id" ]]; then
            echo "No release for $TAG yet; creating a draft"
            # The tag must already exist on GitHub (like `--verify-tag`).
            gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.ref' >/dev/null \
              || { echo "::error::Tag $TAG does not exist on GitHub"; exit 1; }
            prerelease=false
            if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
            # Create via the REST API and take the id from the response:
            # the release list is eventually consistent and may not show a
            # freshly created draft yet, so looking it up again can fail.
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" \
              -f name="LLM Media Library $TAG" \
              -F draft=true \
              -F prerelease="$prerelease" \
              -F generate_release_notes=true \
              --jq '.id')
            [[ -n "$id" ]] || { echo "::error::Failed to create draft release for $TAG"; exit 1; }
            echo "Created draft release $TAG (id $id)"
          else
            echo "Release $TAG exists (id $id); uploading installers without changing its state"
          fi
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          # Upload by release id so drafts work too; replace same-name assets.
          for f in upload/*; do
            name=$(basename "$f")
            # GitHub stores spaces in asset names as dots.
            stored="${name// /.}"
            gh api "repos/$GH_REPO/releases/$id/assets?per_page=100" --paginate \
              --jq ".[] | select(.name == \"$name\" or .name == \"$stored\") | .id" \
              | while read -r asset; do
                  echo "Deleting existing asset $name ($asset)"
                  gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"
                done
            echo "Uploading $name"
            gh api -X POST \
              "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$(jq -rn --arg n "$name" '$n|@uri')" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" --jq '.name'
          done
      - name: Check installers are attached
        run: |
          info=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          assets=$(jq -r '.assets[].name' <<<"$info")
          echo "$assets"
          grep -q -- '-setup\.exe$' <<<"$assets" || { echo "::error::NSIS installer missing from release $TAG"; exit 1; }
          grep -q -- '\.msi$' <<<"$assets" || { echo "::error::MSI installer missing from release $TAG"; exit 1; }
          grep -qx -- 'SHA256SUMS.txt' <<<"$assets" || { echo "::error::SHA256SUMS.txt missing from release $TAG"; exit 1; }
          if [[ "$(jq -r '.draft' <<<"$info")" == "true" ]]; then
            url=$(jq -r '.html_url' <<<"$info")
            echo "::notice::Draft release $TAG is ready for review. Publish it manually: $url"
            echo "Draft release **$TAG** is ready. Review it and click **Publish release**: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Release $TAG is already published; installers were updated."
          fi
